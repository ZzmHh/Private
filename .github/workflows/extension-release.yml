name: Extension Release

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (e.g. extension-v0.4.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: node scripts/verify-extension-tag.mjs "${{ github.ref_name }}"

      - name: Build extension ZIP
        env:
          EXTENSION_DEFAULT_API_BASE: ${{ vars.EXTENSION_DEFAULT_API_BASE || secrets.EXTENSION_DEFAULT_API_BASE || 'https://example.com' }}
          EXTENSION_WEBSITE_URL: ${{ vars.EXTENSION_WEBSITE_URL || secrets.EXTENSION_WEBSITE_URL || 'https://example.com' }}
          EXTENSION_PRIVACY_URL: ${{ vars.EXTENSION_PRIVACY_URL || secrets.EXTENSION_PRIVACY_URL || 'https://example.com/privacy-extension.html' }}
          VITE_EXTENSION_CWS_URL: ${{ vars.VITE_EXTENSION_CWS_URL || secrets.VITE_EXTENSION_CWS_URL || '' }}
        run: npm run build:extension

      - name: Show built version
        run: node -e "console.log('manifest', require('./extension/manifest.json').version)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanmeng-tiktok-extension
          path: public/downloads/fanmeng-tiktok-extension.zip
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/extension-v')
        uses: softprops/action-gh-release@v2
        with:
          files: public/downloads/fanmeng-tiktok-extension.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
