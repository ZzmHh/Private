# Umami 自托管（可选）· 与凡梦官网配合
# 启动: docker compose -f docker-compose.umami.yml up -d
# 然后在 Umami 后台添加网站，把 Website ID 填入 .env 的 VITE_UMAMI_*

services:
  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_change_me
    volumes:
      - umami-db-data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      - umami-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami_change_me@umami-db:5432/umami
      APP_SECRET: change_me_to_random_32_chars_min
      DISABLE_TELEMETRY: "1"

volumes:
  umami-db-data:
