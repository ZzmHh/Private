<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>凡梦AI · TikTok 助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>凡梦AI</h1>
    <p class="sub" id="versionLine">TikTok Shop 专用助手</p>

    <details id="tutorialShell" class="tutorial-shell">
      <summary class="tutorial-shell-summary">📖 5 分钟上手教程</summary>
      <div id="tutorialMount" class="tutorial-shell-body"></div>
    </details>
    <p class="hint tutorial-shell-hint">首次安装会自动展开一次；之后点击标题展开/收起。</p>

    <label>
      凡梦 API 地址
      <input id="apiBase" type="url" placeholder="https://www.fanmengai.com.cn" />
    </label>

    <div id="loginBlock">
      <label>
        邮箱
        <input id="email" type="email" autocomplete="username" />
      </label>
      <label>
        密码
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <button type="button" id="loginBtn" class="primary">登录</button>
    </div>

    <div id="loggedBlock" class="hidden">
      <p id="userLine" class="user-line"></p>
      <p id="planLine" class="plan-line"></p>
      <button type="button" id="subscribeBtn" class="primary hidden">去网站订阅 / 续费</button>
      <button type="button" id="logoutBtn">退出登录</button>
    </div>

    <fieldset class="fieldset">
      <legend>自动化</legend>
      <label class="check">
        <input id="autoCsListen" type="checkbox" />
        聊天页自动监听新消息并生成话术（成长版及以上可自动发送）
      </label>
      <label class="check">
        <input id="autoDiagnosisSync" type="checkbox" />
        非聊天页自动同步诊断包页面
      </label>
      <label class="check">
        <input id="autoSync" type="checkbox" />
        定时同步（分钟）
      </label>
      <input id="autoSyncMinutes" type="number" min="5" max="120" value="15" />
    </fieldset>

    <fieldset class="fieldset">
      <legend>多店铺</legend>
      <ul id="shopList" class="shop-list"></ul>
      <p class="hint">在卖家中心面板点「绑定本页店铺」添加；下拉框切换。</p>
    </fieldset>

    <fieldset class="fieldset">
      <legend>回复模板</legend>
      <ul id="templateList" class="shop-list"></ul>
      <p class="hint">在面板草稿区点「存为模板」；可在面板下拉插入。</p>
    </fieldset>

    <p id="msg" class="msg"></p>

    <button type="button" id="openFaqWeb" class="secondary">网站 · FAQ 生成</button>
    <button type="button" id="openSeller" class="secondary">打开 TikTok 卖家中心</button>
    <p class="hint">更新插件后请在 chrome://extensions 点「重新加载」，并刷新测试页。</p>

    <script src="../src/lib/config.js"></script>
    <script src="../src/lib/permissions.js"></script>
    <script src="../src/lib/tiktok.js"></script>
    <script src="../src/lib/billing.js"></script>
    <script src="../src/lib/tutorial.js"></script>
    <script src="../src/lib/storage.js"></script>
    <script src="../src/lib/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
